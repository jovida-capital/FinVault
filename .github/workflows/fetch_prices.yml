name: Fetch Prices

on:
  schedule:
    # Le cron GitHub est toujours exprimé en UTC et ne suit pas l'heure d'été.
    # Deux déclenchements pour viser 5h à Paris toute l'année :
    #   03:00 UTC = 05:00 Paris en été  (UTC+2)
    #   04:00 UTC = 05:00 Paris en hiver (UTC+1)
    # Le second passage de la journée ne fait que reconfirmer les mêmes cours :
    # le script est idempotent et la clôture officielle prime sur le cours provisoire.
    - cron: '0 3 * * 1-5'
    - cron: '0 4 * * 1-5'
  workflow_dispatch:           # bouton manuel dans l'onglet Actions

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Fetch prices from Yahoo Finance
        run: python Scripts/fetch_prices.py

      - name: Commit prices.json
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/prices.json
          git diff --cached --quiet || git commit -m "chore: update prices $(date -u '+%Y-%m-%d %H:%M UTC')"
          git push
